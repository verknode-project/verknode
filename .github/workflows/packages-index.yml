# verknode's package index (packages/index.json) follows the packages' releases by itself: every day, and on
# demand (a package's release workflow may dispatch it), new GitHub releases of the listed repositories are
# added as versions. Installed copies of verknode then offer them as updates (Settings › Packages).
name: Package index

on:
  schedule: [{cron: "41 3 * * *"}]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: new releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python packages/update_index.py
      - name: commit
        run: |
          if git diff --quiet packages/index.json; then echo "nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Package index: new releases"
          git push
