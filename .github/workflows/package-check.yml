# verknode's checks of a verknode package (docs/packages.md), for the package's own CI:
#
#   jobs:
#     check:
#       uses: verknode-project/verknode/.github/workflows/package-check.yml@main
#
# The package is installed next to verknode's Python (from this repository, at verknode-ref - no frontend
# build), then `python -m jupyterlab_verknode.packages validate` and the package's tests run. The checks live
# here, so they evolve with verknode and every package gets them without changing its own workflow.
name: verknode package check

on:
  workflow_call:
    inputs:
      verknode-ref: {type: string, default: main, description: "verknode's branch, tag or commit to check against"}
      python-version: {type: string, default: "3.12"}
      path: {type: string, default: ".", description: "the package's folder in its repository"}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: verknode-project/verknode
          ref: ${{ inputs.verknode-ref }}
          path: _verknode
          sparse-checkout: extension
      - uses: actions/setup-python@v6
        with: {python-version: "${{ inputs.python-version }}"}
      - name: verknode's Python, and the package
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter_server>=2.0.1,<3" "polars>=1.0" "numpy>=1.24" pyarrow packaging pytest
          pip install -e "${{ inputs.path }}[test]" || pip install -e "${{ inputs.path }}"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/_verknode/extension" >> "$GITHUB_ENV"
      - name: verknode's node API
        run: python -m jupyterlab_verknode.packages api
      - name: validate
        run: python -m jupyterlab_verknode.packages validate "${{ inputs.path }}"
      - name: tests
        run: |
          if [ -d "${{ inputs.path }}/tests" ]; then python -m pytest -q "${{ inputs.path }}/tests"; else echo "no tests"; fi
