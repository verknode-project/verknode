[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab_verknode"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python :: 3",
]
dependencies = ["jupyter_server>=2.0.1,<3", "polars>=1.0"]
dynamic = ["version", "description", "keywords"]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "keywords"]

[tool.hatch.build.targets.wheel]
packages = ["jupyterlab_verknode", "verknode"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_verknode/labextension"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_verknode/labextension" = "share/jupyter/labextensions/jupyterlab-verknode"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "jupyterlab_verknode/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_verknode/labextension/static/style.js",
    "jupyterlab_verknode/labextension/package.json",
]
skip-if-exists = ["jupyterlab_verknode/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_verknode/labextension"
