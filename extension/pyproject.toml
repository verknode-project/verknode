[build-system]
requires = ["hatchling>=1.27", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab_verknode"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python :: 3",
]
dynamic = ["version", "description", "keywords"]

# the core: the editor, the engine and the ~240 nodes on tables, files, flow control, widgets, LLMs
dependencies = ["jupyter_server>=2.0.1,<3", "polars>=1.0", "numpy>=1.24"]

# what some nodes need besides (the editor marks nodes whose packages are missing; docs/install.md)
[project.optional-dependencies]
chem = ["rdkit>=2023.9"]                                # RDKit nodes, molecules, 3D structures
ml = ["scikit-learn>=1.3", "scipy>=1.10", "statsmodels>=0.14", "pandas>=2.0", "matplotlib>=3.7"]
formats = ["fastexcel>=0.10", "xlsxwriter>=3.1", "openpyxl>=3.1", "lxml>=5.0", "jsonpath-ng>=1.6"]
notebooks = ["nbclient>=0.9", "nbformat>=5.9", "ipykernel>=6.25"]  # the Jupyter Notebook node
all = ["jupyterlab_verknode[chem,ml,formats,notebooks]"]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "keywords"]

[tool.hatch.build.targets.wheel]
packages = ["jupyterlab_verknode", "verknode"]
artifacts = ["jupyterlab_verknode/vendor"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_verknode/labextension", "jupyterlab_verknode/vendor"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_verknode/labextension" = "share/jupyter/labextensions/jupyterlab-verknode"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "jupyterlab_verknode/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_verknode/labextension/static/style.js",
    "jupyterlab_verknode/labextension/package.json",
    "jupyterlab_verknode/vendor/ngl/ngl.js",
    "jupyterlab_verknode/vendor/molstar/molstar.js",
]
skip-if-exists = ["jupyterlab_verknode/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_verknode/labextension"
