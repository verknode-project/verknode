# JupyterLab with the verknode extension, published on a local port.
#
# This file is the same everywhere. What differs between environments (port,
# host name, reverse proxy, networks) goes in .env and / or
# compose.override.yml next to it - both gitignored; docker compose reads them
# automatically. See docs/deployment.md and the examples in deploy/.
# Run from this folder (`make up`, `docker compose up -d`), or from the
# repository root with `make -C docker up`.
name: verknode

services:
    verknode:
        image: ${VERKNODE_IMAGE:-verknode:latest}
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        environment:
            - SERVICENAME=verknode
            # LLM Prompter defaults (set them in .env; see docs/llm.md)
            - VERKNODE_LLM_URL=${VERKNODE_LLM_URL:-}
            - VERKNODE_LLM_MODEL=${VERKNODE_LLM_MODEL:-}
            - VERKNODE_LLM_PROVIDER=${VERKNODE_LLM_PROVIDER:-}
        # (an Ollama on the Docker host: VERKNODE_LLM_URL=http://host.docker.internal:11434)
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${VERKNODE_BIND:-127.0.0.1}:${VERKNODE_PORT:-8888}:8888"
        volumes:
            - ../notebooks:/home/jovyan/notebooks
            # JupyterLab extension source, dev-installed at container start (vkn_: verknode's own files -
            # not to be touched unless working on verknode)
            - ../extension:/home/jovyan/vkn_extension
            # its start hook from here (not the image's copy): changes need no rebuild
            - ./before-notebook.d/10-verknode-extension.sh:/usr/local/bin/before-notebook.d/10-verknode-extension.sh:ro
        env_file:
            - credentials_norepo.env
